name: Benchmarks

on:
  schedule:
    - cron: "0 5 * * 6" # Every Saturday at 5:00 UTC
  push:
    branches:
      - master

jobs:
  bench:
    name: Benchmarks
    runs-on: parity-benchmark
    container:
      image: "paritytech/ci-unified:bullseye-1.88.0-2025-06-27-v202511141243"
    steps:
      - name: Checkout Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: run benchmarks
        shell: bash
        run: |
          ulimit -n "$(ulimit -Hn)"
          cargo bench -p jsonrpsee-benchmarks -- --output-format bencher | tee output.txt

      - name: Store benchmark result
        uses: rhysd/github-action-benchmark@4e0b38bc48375986542b13c0d8976b7b80c60c00 # v1.20.5
        with:
          tool: "cargo"
          output-file-path: "output.txt"
          benchmark-data-dir-path: "bench/dev2"
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: true
